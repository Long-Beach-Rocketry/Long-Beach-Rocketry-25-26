syntax = "proto3";

// TODO: This is not finalized (Field could be changed)
// According to AirBrakeApp & LoRa transciever maximum capabilities

enum FswStatus {
    FSW_STATUS_UNKNOWN = 0;
    FSW_STATUS_IDLE    = 1;
    FSW_STATUS_ACTIVE  = 2;
}

enum RocketState {
    ROCKET_STATE_UNKNOWN        = 0;
    ROCKET_STATE_IDLE           = 1;
    ROCKET_STATE_POWERED_FLIGHT = 2;
    ROCKET_STATE_COAST          = 3;
    ROCKET_STATE_APOGEE         = 4;
    ROCKET_STATE_DESCENT        = 5;
    ROCKET_STATE_LANDED         = 6;
}

enum AirbrakeStatus {
    AIRBRAKE_STATUS_PRELAUNCH                = 0;  // Not launched yet
    AIRBRAKE_STATUS_LAUNCHED                 = 1;  // 6 second interval from launch
    AIRBRAKE_STATUS_AIRBRAKES_DEPLOYING      = 2;  // Deploy airbrakes after 6 seconds
    AIRBRAKE_STATUS_AIRBRAKES_FULLY_DEPLOYED = 3;  // When at 30 degrees; not sure when to know though
    AIRBRAKE_STATUS_AIRBRAKES_RETRACTING     = 4;  // Should do before target apogee
    AIRBRAKE_STATUS_AIRBRAKES_FULLY_RETRACTED = 5;  // Again, dont know how to know if retracted
    AIRBRAKE_STATUS_RECOVERY_POPPED          = 6;  // Job finished
}

message StatusData {
    FswStatus      fsw_status      = 1;
    RocketState    rocket_state    = 2;
    AirbrakeStatus airbrake_status = 3;
}

message IMUData {
    float accel_x        = 1;
    float accel_y        = 2;
    float accel_z        = 3;
    float gyro_x         = 4;
    float gyro_y         = 5;
    float gyro_z         = 6;
    float quat_x         = 7;
    float quat_y         = 8;
    float quat_z         = 9;
    float quat_w         = 10;
    float linear_accel_x = 11;
    float linear_accel_y = 12;
    float linear_accel_z = 13;
    float gravity_x      = 14;
    float gravity_y      = 15;
    float gravity_z      = 16;
}

message BaroData {
    float air_pressure = 1;  // Pascals
    float altitude     = 2;  // Meters
    float temperature  = 3;  // Celsius
}

message RocketMessage {
    StatusData status       = 1;
    IMUData    imu          = 2;
    BaroData   baro         = 3;
    uint32     timestamp_us = 4;
}
